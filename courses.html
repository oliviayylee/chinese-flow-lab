<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>강의실 | Chinese Flow Lab</title>

<style>
body{
  margin:0;
  font-family:"Pretendard","Noto Sans KR",sans-serif;
  background:#f6f1ea;
  color:#2f241d;
}

header{
  background:#3c2b22;
  color:white;
  padding:24px 8%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  margin:0;
  font-size:28px;
}

header a{
  color:white;
  text-decoration:none;
  opacity:.85;
}

.container{
  max-width:1000px;
  margin:0 auto;
  padding:70px 8%;
}

.title{
  text-align:center;
  margin-bottom:46px;
}

.title h2{
  font-size:46px;
  color:#4a2d1f;
  margin:0 0 14px;
}

.title p{
  font-size:18px;
  color:#666;
}

.course-list{
  display:flex;
  flex-direction:column;
  gap:24px;
}

.course-card{
  display:block;
  background:white;
  border-radius:28px;
  padding:34px 40px;
  text-decoration:none;
  color:#2f241d;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
  transition:.25s;
}

.course-card:hover{
  transform:translateY(-4px);
  box-shadow:0 14px 34px rgba(0,0,0,.12);
}

.course-card h3{
  margin:0;
  font-size:30px;
  color:#5a3427;
}

.course-card.disabled{
  pointer-events:none;
  opacity:.45;
}

@media(max-width:768px){
  .container{
    padding:46px 5%;
  }

  .title h2{
    font-size:34px;
  }

  .course-card{
    padding:28px;
  }

  .course-card h3{
    font-size:24px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Chinese Flow Lab</h1>
  <a href="index.html">홈으로</a>
</header>

<div class="container">

  <div class="title">
    <h2>강의실</h2>
    <p>수강할 과목을 선택하세요.</p>
  </div>

  <div class="course-list">

    <a href="classroom.html" class="course-card">
      <h3>중급 중국어 듣기와 쓰기</h3>
    </a>

    <a href="#" class="course-card disabled">
      <h3>초급 중국어 회화</h3>
    </a>

  </div>

</div>

</body>
</html>
