<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중급 중국어 듣기와 쓰기 | Chinese Flow Lab</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:"Pretendard","Noto Sans KR",sans-serif;
  background:#f6f1ea;
  color:#2f241d;
}

/* 상단 */

header{
  background:#3c2b22;
  color:white;
  padding:24px 8%;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  font-size:28px;
}

header a{
  color:white;
  text-decoration:none;
  opacity:.85;
}

/* 메인 */

.container{
  max-width:1000px;
  margin:auto;
  padding:80px 24px;
}

/* 제목 */

.title{
  text-align:center;
  margin-bottom:70px;
}

.title h2{
  font-size:48px;
  color:#6f432a;
  margin-bottom:18px;
}

.title p{
  font-size:20px;
  color:#5f5148;
}

/* 메뉴 */

.menu-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:26px;
}

/* 카드 */

.menu-card{
  background:white;

  border-radius:28px;

  padding:42px 24px;

  text-align:center;

  text-decoration:none;

  color:#2f241d;

  box-shadow:0 10px 24px rgba(0,0,0,.08);

  transition:.25s;
}

.menu-card:hover{
  transform:translateY(-5px);
  background:#fffaf5;
}

.icon{
  font-size:46px;
  margin-bottom:20px;
}

.menu-card h3{
  font-size:26px;
  color:#4b2f22;
}

/* 모바일 */

@media(max-width:768px){

  .title h2{
    font-size:40px;
  }

  .menu-card{
    padding:36px 20px;
  }

}

</style>
</head>

<body>

<header>

  <h1>Chinese Flow Lab</h1>

  <a href="classroom.html">강의실로</a>

</header>

<div class="container">

  <div class="title">

    <h2>중급 중국어 듣기와 쓰기</h2>

    <p>수업 메뉴를 선택하세요.</p>

  </div>

  <div class="menu-grid">

    <a href="pretest.html" class="menu-card">
      <div class="icon">📝</div>
      <h3>사전 진단</h3>
    </a>

    <a href="profile.html" class="menu-card">
      <div class="icon">👤</div>
      <h3>학습 프로필</h3>
    </a>

    <a href="video.html" class="menu-card">
      <div class="icon">🎧</div>
      <h3>사전 영상</h3>
    </a>

    <a href="practice.html" class="menu-card">
      <div class="icon">📚</div>
      <h3>맞춤형 연습문제</h3>
    </a>

  </div>

</div>

</body>
</html>
