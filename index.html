<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chinese Flow Lab</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:"Pretendard","Noto Sans KR",sans-serif;
  color:white;
}

.hero{
  min-height:100vh;
  background:
    linear-gradient(rgba(0,0,0,.48), rgba(0,0,0,.48)),
    url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?q=80&w=1600&auto=format&fit=crop');
  background-size:cover;
  background-position:center;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:60px 8%;
}

.content{
  width:100%;
  max-width:1200px;
  text-align:center;
}

.logo{
  font-size:70px;
  font-weight:800;
  margin-bottom:22px;
}

.subtitle{
  font-size:28px;
  font-weight:700;
  line-height:1.6;
  margin-bottom:52px;
}

.track-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:24px;
}

.track-card{
  background:rgba(255,255,255,.16);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.32);
  border-radius:34px;
  padding:42px 30px;
  box-shadow:0 14px 34px rgba(0,0,0,.18);
}

.track-card h2{
  font-size:32px;
  margin-bottom:14px;
}

.track-card h3{
  font-size:21px;
  margin-bottom:28px;
  font-weight:600;
}

.btn{
  display:inline-block;
  text-decoration:none;
  color:white;
  font-size:17px;
  font-weight:700;
  padding:16px 36px;
  border-radius:999px;
  transition:.25s;
}

.btn.primary{
  background:#e98c73;
}

.btn.secondary{
  background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.55);
}

.btn:hover{
  transform:translateY(-3px);
}

@media(max-width:900px){
  .logo{
    font-size:44px;
  }

  .subtitle{
    font-size:21px;
  }

  .track-grid{
    grid-template-columns:1fr;
  }

  .track-card{
    padding:32px 24px;
  }
}
</style>
</head>

<body>

<section class="hero">

  <div class="content">

    <div class="logo">Chinese Flow Lab</div>

    <div class="subtitle">
      AI 기반 중국어 학습 및 연구 플랫폼
    </div>

    <div class="track-grid">

      <div class="track-card">
        <h2>About</h2>
        <h3>Teaching · Research · Profile</h3>
        <a href="about.html" class="btn secondary">둘러보기</a>
      </div>

      <div class="track-card">
        <h2>Learning Track</h2>
        <h3>맞춤형 학습 공간</h3>
        <a href="courses.html" class="btn primary">입장하기</a>
      </div>

      <div class="track-card">
        <h2>Research Track</h2>
        <h3>학습 데이터 연구 공간</h3>
        <a href="research.html" class="btn secondary">둘러보기</a>
      </div>

    </div>

  </div>

</section>

</body>
</html>
