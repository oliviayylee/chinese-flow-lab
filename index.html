<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chinese Flow Lab</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:"Pretendard","Noto Sans KR",sans-serif;
  color:white;
  background:#2f241d;
}

.hero{
  min-height:100vh;
  background:
    linear-gradient(rgba(0,0,0,.48), rgba(0,0,0,.56)),
    url("cafe.jpg");
  background-size:cover;
  background-position:center;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:40px 24px;
}

.content{
  max-width:760px;
}

h1{
  font-size:86px;
  line-height:1.2;
  margin:0 0 42px;
  font-weight:800;
  letter-spacing:1px;
}

h2{
  font-size:34px;
  line-height:1.45;
  margin:0 0 34px;
  font-weight:700;
}

p{
  font-size:24px;
  line-height:1.7;
  margin:0 0 60px;
  font-weight:400;
}

.buttons{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:28px;
}

.btn{
  display:inline-block;
  width:340px;
  padding:24px 34px;
  border-radius:48px;
  text-decoration:none;
  font-size:26px;
  font-weight:600;
  transition:.25s;
}

.btn-primary{
  background:#a2694d;
  color:white;
}

.btn-primary:hover{
  background:#8d573e;
}

.btn-outline{
  border:2px solid rgba(255,255,255,.8);
  color:white;
  background:rgba(0,0,0,.18);
  backdrop-filter:blur(3px);
}

.btn-outline:hover{
  background:rgba(255,255,255,.15);
}

@media(max-width:768px){
  h1{
    font-size:58px;
    margin-bottom:34px;
  }

  h2{
    font-size:27px;
  }

  p{
    font-size:20px;
    margin-bottom:48px;
  }

  .btn{
    width:300px;
    font-size:23px;
    padding:22px 30px;
  }
}

@media(max-width:420px){
  h1{
    font-size:52px;
  }

  h2{
    font-size:25px;
  }

  p{
    font-size:19px;
  }

  .btn{
    width:280px;
  }
}
</style>
</head>

<body>

<section class="hero">
  <div class="content">
    <h1>Chinese<br>Flow Lab</h1>

    <h2>함께 배우고 소통하는<br>중국어 학습 공간</h2>

    <p>
      플립드러닝과 맞춤형 학습 분석을 기반으로 한<br>
      중국어 학습 플랫폼입니다.
    </p>

    <div class="buttons">
      <a href="classroom.html" class="btn btn-primary">강의실 입장하기</a>
      <a href="platform.html" class="btn btn-outline">플랫폼 둘러보기</a>
    </div>
  </div>
</section>

</body>
</html>
