<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>학습 프로필 | Chinese Flow Lab</title>

<style>

body{
  margin:0;
  font-family:"Pretendard","Noto Sans KR",sans-serif;
  background:#f6f1ea;
  color:#2f241d;
}

header{
  background:#3c2b22;
  color:white;
  padding:24px 8%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  margin:0;
  font-size:28px;
}

header a{
  color:white;
  text-decoration:none;
  opacity:.85;
}

.container{
  padding:60px 8%;
}

.title h2{
  font-size:42px;
  margin:0 0 14px;
  color:#4a2d1f;
}

.title p{
  font-size:18px;
  color:#666;
  line-height:1.8;
  margin-bottom:36px;
}

.card{
  background:white;
  border-radius:32px;
  padding:38px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
  margin-bottom:30px;
}

.badge{
  display:inline-block;
  background:#f2e4db;
  color:#8a4d33;
  padding:10px 18px;
  border-radius:999px;
  font-weight:700;
  margin-bottom:18px;
}

.profile-type{
  font-size:38px;
  color:#5a3427;
  margin:0 0 18px;
}

.desc{
  line-height:1.9;
  color:#666;
  font-size:17px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:28px;
}

.box{
  background:white;
  border-radius:28px;
  padding:30px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.box h3{
  margin-top:0;
  color:#5a3427;
}

.skill{
  margin-bottom:24px;
}

.skill-name{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
  font-weight:700;
}

.bar{
  height:14px;
  background:#eee2da;
  border-radius:999px;
  overflow:hidden;
}

.fill{
  height:100%;
  background:linear-gradient(135deg,#9d5a3d,#6f432a);
  border-radius:999px;
}

ul{
  line-height:2;
  color:#555;
  padding-left:20px;
}

.note{
  background:#faf6f2;
  border-radius:20px;
  padding:24px;
  line-height:1.9;
  color:#555;
}

.back-btn{
  display:inline-block;
  margin-top:30px;
  color:#6f432a;
  text-decoration:none;
  font-weight:700;
}

@media(max-width:768px){

  .container{
    padding:36px 5%;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .profile-type{
    font-size:30px;
  }

  .title h2{
    font-size:32px;
  }
}

</style>
</head>

<body>

<header>
  <h1>Chinese Flow Lab</h1>
  <a href="classroom.html">강의실로 돌아가기</a>
</header>

<div class="container">

  <div class="title">

    <h2>학습 프로필</h2>

    <p>
      사전 진단 결과를 바탕으로 학습자의 중국어 듣기·쓰기 학습 특성을 분석합니다.
    </p>

  </div>

  <div class="card">

    <div class="badge">
      Adaptive Learning Profile
    </div>

    <h2 class="profile-type" id="profileType">
      분석 중...
    </h2>

    <p class="desc" id="profileDesc">
      학습 데이터를 분석하고 있습니다.
    </p>

  </div>

  <div class="grid">

    <div class="box">

      <h3>영역별 진단 결과</h3>

      <div class="skill">
        <div class="skill-name">
          <span>문장 듣기 이해</span>
          <span id="listeningScore">0/10</span>
        </div>

        <div class="bar">
          <div class="fill" id="listeningBar"></div>
        </div>
      </div>

      <div class="skill">
        <div class="skill-name">
          <span>딕토글로스</span>
          <span id="dictoglossScore">0/5</span>
        </div>

        <div class="bar">
          <div class="fill" id="dictoglossBar"></div>
        </div>
      </div>

      <div class="skill">
        <div class="skill-name">
          <span>받아쓰기</span>
          <span id="dictationScore">0/5</span>
        </div>

        <div class="bar">
          <div class="fill" id="dictationBar"></div>
        </div>
      </div>

      <div class="skill">
        <div class="skill-name">
          <span>의견제시형 글쓰기</span>
          <span id="writingScore">0/5</span>
        </div>

        <div class="bar">
          <div class="fill" id="writingBar"></div>
        </div>
      </div>

    </div>

    <div class="box">

      <h3>추천 연습 유형</h3>

      <ul id="recommendList">
      </ul>

    </div>

  </div>

  <div class="card">

    <h3>AI 학습 분석</h3>

    <div class="note" id="analysisText">
      분석 결과를 불러오는 중입니다.
    </div>

  </div>

  <a href="classroom.html" class="back-btn">
    ← 강의실로 돌아가기
  </a>

</div>

<script>

const listening =
Number(localStorage.getItem("listening")) || 0;

const dictogloss =
Number(localStorage.getItem("dictogloss")) || 0;

const dictation =
Number(localStorage.getItem("dictation")) || 0;

const writing =
Number(localStorage.getItem("writing")) || 0;

document.getElementById("listeningScore").innerText =
`${listening}/10`;

document.getElementById("dictoglossScore").innerText =
`${dictogloss}/5`;

document.getElementById("dictationScore").innerText =
`${dictation}/5`;

document.getElementById("writingScore").innerText =
`${writing}/5`;

document.getElementById("listeningBar").style.width =
(listening * 10) + "%";

document.getElementById("dictoglossBar").style.width =
(dictogloss * 20) + "%";

document.getElementById("dictationBar").style.width =
(dictation * 20) + "%";

document.getElementById("writingBar").style.width =
(writing * 20) + "%";

let type = "";
let desc = "";
let analysis = "";
let recommends = [];

const listeningRate = listening / 10;
const dictoglossRate = dictogloss / 5;
const dictationRate = dictation / 5;
const writingRate = writing / 5;

if(dictoglossRate <= 0.5 && writingRate <= 0.5){

  type =
  "의미 재구성·출력 통합 보완형";

  desc =
  "들은 내용을 핵심 의미 중심으로 재구성하고 자신의 의견으로 확장하는 능력에 보완이 필요합니다.";

  analysis =
  "학습자는 전체적인 의미 흐름은 일부 이해하지만, 이를 자신의 언어로 재구성하거나 확장하는 과정에서 어려움을 보였습니다. 특히 딕토글로스와 의견제시형 글쓰기 영역에서 낮은 수행을 보였습니다.";

  recommends = [
    "키워드 메모 연습",
    "딕토글로스 문장 재구성",
    "paraphrasing 활동",
    "我认为 구조 연습",
    "이유 제시 문장 만들기",
    "짧은 의견문 쓰기"
  ];

}

else if(listeningRate <= 0.5){

  type =
  "문장 듣기 이해 보완형";

  desc =
  "짧은 담화의 핵심 의미와 전체 흐름을 이해하는 능력에 보완이 필요합니다.";

  analysis =
  "학습자는 개별 단어는 일부 이해하지만, 문장 전체의 핵심 정보와 흐름을 연결하는 과정에서 어려움을 보였습니다.";

  recommends = [
    "짧은 문장 듣기 반복",
    "핵심 정보 찾기",
    "내용 일치 문제",
    "속도 조절 듣기",
    "짧은 담화 이해 연습"
  ];

}

else if(dictoglossRate <= 0.5){

  type =
  "딕토글로스 보완형";

  desc =
  "들은 내용을 핵심 의미 중심으로 재구성하는 능력에 보완이 필요합니다.";

  analysis =
  "학습자는 들은 내용을 부분적으로 이해하지만, 이를 핵심 의미 중심으로 재구성하는 과정에서 어려움을 보였습니다.";

  recommends = [
    "키워드 메모 활동",
    "문장 재배열 활동",
    "의미 재구성 쓰기",
    "paraphrasing 연습",
    "짧은 dictogloss 활동"
  ];

}

else if(dictationRate <= 0.5){

  type =
  "음성-문자 연결 보완형";

  desc =
  "중국어 소리 정보를 문자 정보로 정확하게 변환하는 능력에 보완이 필요합니다.";

  analysis =
  "학습자는 전체 의미 이해는 가능하지만, 세부 음절과 한자 표기 정확도에서 반복적인 오류가 나타났습니다.";

  recommends = [
    "빈칸 받아쓰기",
    "핵심 어휘 dictation",
    "성조 구분 연습",
    "짧은 문장 따라쓰기",
    "음절 단위 듣기"
  ];

}

else if(writingRate <= 0.5){

  type =
  "의견 표현 확장형";

  desc =
  "자신의 생각을 논리적으로 확장하여 표현하는 능력에 보완이 필요합니다.";

  analysis =
  "학습자는 듣기 이해와 정보 파악은 비교적 안정적이지만, 자신의 의견을 중국어 문장으로 논리적으로 확장하는 데 어려움을 보였습니다.";

  recommends = [
    "我认为 구조 연습",
    "因为…所以… 문장 만들기",
    "찬반 표현 연습",
    "짧은 의견문 쓰기",
    "근거 제시 연습"
  ];

}

else{

  type =
  "균형 발전형 학습자";

  desc =
  "문장 듣기 이해, 의미 재구성, 받아쓰기, 의견 표현 영역이 비교적 균형 있게 발달되어 있습니다.";

  analysis =
  "학습자는 전반적인 중국어 듣기·쓰기 수행에서 안정적인 모습을 보였습니다. 이후에는 보다 복합적인 담화 재구성과 확장형 글쓰기 활동을 통해 심화 학습을 진행하는 것이 좋습니다.";

  recommends = [
    "심화 딕토글로스 활동",
    "복합 담화 듣기",
    "자유 의견 글쓰기",
    "중국 문화 비교 토론",
    "장문 paraphrasing"
  ];

}

document.getElementById("profileType").innerText =
type;

document.getElementById("profileDesc").innerText =
desc;

document.getElementById("analysisText").innerText =
analysis;

document.getElementById("recommendList").innerHTML =
recommends.map(item => `<li>${item}</li>`).join("");

</script>

</body>
</html>
