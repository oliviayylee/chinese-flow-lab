<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>주제 1. 학교생활 | Chinese Flow Lab</title>

<style>
body{
  margin:0;
  font-family:"Pretendard","Noto Sans KR",sans-serif;
  background:#f6f1ea;
  color:#2f241d;
}

header{
  background:#3c2b22;
  color:white;
  padding:24px 8%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  margin:0;
  font-size:28px;
}

header a{
  color:white;
  text-decoration:none;
  opacity:.85;
}

.container{
  padding:60px 8%;
}

.video-card{
  background:white;
  border-radius:32px;
  padding:40px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.badge{
  display:inline-block;
  background:#f2e4db;
  color:#8a4d33;
  padding:10px 18px;
  border-radius:999px;
  font-size:14px;
  font-weight:600;
  margin-bottom:18px;
}

.video-card h2{
  margin:0 0 16px;
  font-size:42px;
  color:#4a2d1f;
}

.desc{
  font-size:18px;
  line-height:1.8;
  color:#666;
  margin-bottom:36px;
}

.video-wrapper{
  position:relative;
  width:100%;
  padding-bottom:56.25%;
  border-radius:24px;
  overflow:hidden;
  background:black;
}

.video-wrapper iframe{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  border:0;
}

.info-box{
  margin-top:28px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.info-item{
  background:#faf6f2;
  border-radius:20px;
  padding:22px;
}

.info-item h4{
  margin:0 0 10px;
  color:#8a4d33;
  font-size:16px;
}

.info-item p{
  margin:0;
  line-height:1.7;
  color:#555;
  font-size:15px;
}

.back-btn{
  display:inline-block;
  margin-top:36px;
  background:linear-gradient(135deg,#9d5a3d,#6f432a);
  color:white;
  text-decoration:none;
  padding:16px 28px;
  border-radius:999px;
  font-weight:600;
}

@media(max-width:768px){
  .container{
    padding:32px 5%;
  }

  .video-card{
    padding:24px;
  }

  .video-card h2{
    font-size:30px;
  }

  .desc{
    font-size:16px;
  }

  .info-box{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>Chinese Flow Lab</h1>
  <a href="classroom.html">강의실로 돌아가기</a>
</header>

<div class="container">
  <div class="video-card">

    <div class="badge">Flipped Learning</div>

    <h2>주제 1. 학교생활</h2>

    <p class="desc">
      중국 대학생들의 학교생활과 관련된 표현을 학습합니다.<br>
      영상을 시청한 후 핵심 표현과 학습 내용을 정리해 보세요.
    </p>

    <div class="video-wrapper">
      <iframe
        src="https://www.youtube.com/watch?v=97JeDjTzVdQ"
        title="주제 1. 학교생활"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>

    <div class="info-box">
      <div class="info-item">
        <h4>학습 목표</h4>
        <p>학교생활 관련 표현 이해 및 활용</p>
      </div>

      <div class="info-item">
        <h4>핵심 활동</h4>
        <p>듣기 · 표현 정리 · 내용 이해</p>
      </div>

      <div class="info-item">
        <h4>수업 방식</h4>
        <p>플립드러닝 기반 사전 학습</p>
      </div>
    </div>

    <a href="classroom.html" class="back-btn">← 강의실로 돌아가기</a>

  </div>
</div>

</body>
</html>
