<!DOCTYPE html>

<head>

<title>주제 1. 학교생활 | Chinese Flow Lab</title>

<style>
body{margin:0;font-family:"Pretendard","Noto Sans KR",sans-serif;background:#f6f1ea;color:#2f241d;}
header{background:#3c2b22;color:white;padding:24px 8%;display:flex;justify-content:space-between;align-items:center;}
header h1{margin:0;font-size:28px;}
header a{color:white;text-decoration:none;opacity:.85;}
.container{padding:60px 8%;}
.video-card{background:white;border-radius:32px;padding:40px;box-shadow:0 10px 30px rgba(0,0,0,.08);}
.badge{display:inline-block;background:#f2e4db;color:#8a4d33;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;margin-bottom:18px;}
.video-card h2{margin:0 0 16px;font-size:42px;color:#4a2d1f;}
.desc{font-size:18px;line-height:1.8;color:#666;margin-bottom:36px;}
.video-wrapper{position:relative;width:100%;padding-bottom:56.25%;border-radius:24px;overflow:hidden;background:black;}
.video-wrapper iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}
.info-box{margin-top:30px;}
.info-item{background:#faf6f2;border-radius:24px;padding:28px;}
.info-item h4{margin:0 0 14px;color:#8a4d33;font-size:22px;}
.info-item p{margin:0;line-height:1.9;color:#555;font-size:17px;}
.quiz-box{margin-top:42px;background:#faf6f2;border-radius:28px;padding:34px;}
.quiz-box h3{margin-top:0;font-size:30px;color:#5a3427;}
.quiz-box p{color:#666;line-height:1.8;margin-bottom:28px;}
.quiz-btn,.back-btn{display:inline-block;background:linear-gradient(135deg,#9d5a3d,#6f432a);color:white;text-decoration:none;padding:16px 32px;border-radius:999px;font-weight:700;box-shadow:0 6px 14px rgba(111,67,42,.25);}
.back-btn{margin-top:40px;}
@media(max-width:768px){.container{padding:34px 5%;}.video-card{padding:24px;}.video-card h2{font-size:30px;}.desc{font-size:16px;}.quiz-box{padding:24px;}}
</style>
</head>

<body>

<header>
  <h1>Chinese Flow Lab</h1>
  <a href="classroom.html">강의실로 돌아가기</a>
</header>

<div class="container">
  <div class="video-card">

    <div class="badge">Flipped Learning</div>

    <h2>주제 1. 학교생활</h2>

    <p class="desc">
      중국 대학생들의 학교생활과 관련된 표현을 학습합니다.<br>
      영상을 시청한 후 핵심 표현과 학습 내용을 정리해 보세요.
    </p>

    <div class="video-wrapper">
      <iframe
        src="https://www.youtube.com/embed/97JeDjTzVdQ"
        title="주제1 학교생활"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>

    <div class="info-box">
      <div class="info-item">
        <h4>학습 목표</h4>
        <p>
          중국의 대학 생활 문화를 이해하고<br>
          관련 핵심 어휘 및 어법 표현을 익힌다.
        </p>
      </div>
    </div>

    <div class="quiz-box">
      <h3>사전 학습 확인 퀴즈</h3>
      <p>
        영상을 시청한 후 아래 버튼을 눌러 퀴즈를 제출하세요.<br>
        제출 결과는 자동 저장되며, 학습 프로필 분석에 활용됩니다.

         target="_blank"
         class="quiz-btn">
        퀴즈 풀기
      </a>
    </div>

    <a href="classroom.html" class="back-btn">← 강의실로 돌아가기</a>

  </div>
</div>
