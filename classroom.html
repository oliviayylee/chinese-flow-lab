<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>중급 중국어 듣기와 쓰기 | Chinese Flow Lab</title>

<style>
body{
  margin:0;
  font-family:"Pretendard","Noto Sans KR",sans-serif;
  background:#f6f1ea;
  color:#2f241d;
}

header{
  background:#3c2b22;
  color:white;
  padding:24px 8%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  margin:0;
  font-size:28px;
}

header a{
  color:white;
  text-decoration:none;
  opacity:.85;
}

.container{
  padding:60px 8%;
}

.title{
  margin-bottom:36px;
}

.title h2{
  font-size:42px;
  margin:0;
  color:#4a2d1f;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:32px;
}

.card{
  background:white;
  border-radius:32px;
  padding:46px 40px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
  min-height:220px;
}

.icon{
  font-size:46px;
  margin-bottom:22px;
}

.card h3{
  font-size:30px;
  margin:0 0 28px;
  color:#5a3427;
}

.card-btn{
  display:inline-block;
  background:linear-gradient(135deg,#9d5a3d,#6f432a);
  color:white;
  text-decoration:none;
  padding:14px 28px;
  border-radius:999px;
  font-weight:700;
  box-shadow:0 6px 14px rgba(111,67,42,.25);
}

@media(max-width:768px){
  .container{
    padding:36px 5%;
  }

  .title h2{
    font-size:32px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .card{
    padding:32px 28px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Chinese Flow Lab</h1>
  <a href="courses.html">과목 선택으로</a>
</header>

<div class="container">

  <div class="title">
    <h2>중급 중국어 듣기와 쓰기</h2>
  </div>

  <div class="grid">

    <div class="card">
      <div class="icon">📋</div>
      <h3>사전 진단</h3>
      <a href="pretest.html" class="card-btn">진단 시작하기</a>
    </div>

    <div class="card">
      <div class="icon">📊</div>
      <h3>학습 프로필</h3>
      <a href="profile.html" class="card-btn">프로필 보기</a>
    </div>

    <div class="card">
      <div class="icon">🎥</div>
      <h3>플립드러닝 영상</h3>
      <a href="lecture.html" class="card-btn">강의 보러가기</a>
    </div>

    <div class="card">
      <div class="icon">✍️</div>
      <h3>맞춤형 연습</h3>
      <a href="practice.html" class="card-btn">연습 시작하기</a>
    </div>

  </div>

</div>

</body>
</html>
