<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강의실 | Chinese Flow Lab</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:"Pretendard","Noto Sans KR",sans-serif;
  background:#f5f1eb;
  color:#2f241d;
}

/* 상단 */

header{
  background:#3b2b22;
  color:white;
  padding:26px 8%;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  font-size:32px;
  font-weight:800;
}

header a{
  color:white;
  text-decoration:none;
  opacity:.9;
  font-size:18px;
}

/* 메인 */

.container{
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:70px 24px;
}

/* 제목 */

.title{
  text-align:center;
  margin-bottom:60px;
}

.title h2{
  font-size:52px;
  color:#6f432a;
  margin-bottom:20px;
}

.title p{
  font-size:22px;
  line-height:1.7;
  color:#5f5148;
}

/* 카드 영역 */

.course-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(320px,1fr));
  gap:34px;
}

/* 카드 */

.course-card{
  background:white;
  border-radius:30px;
  overflow:hidden;

  box-shadow:0 12px 28px rgba(0,0,0,.08);

  transition:.25s;
}

.course-card:hover{
  transform:translateY(-6px);
}

/* 카드 이미지 */

.course-image{
  height:220px;
  background-size:cover;
  background-position:center;
}

/* 카드 내용 */

.course-content{
  padding:32px;
}

.course-content h3{
  font-size:30px;
  margin-bottom:18px;
  color:#4b2f22;
}

.course-content p{
  font-size:18px;
  line-height:1.7;
  color:#5f5148;
  margin-bottom:30px;
}

/* 버튼 */

.course-btn{
  display:inline-block;

  padding:16px 30px;

  border-radius:40px;

  background:#a2694d;
  color:white;

  text-decoration:none;

  font-size:18px;
  font-weight:600;

  transition:.2s;
}

.course-btn:hover{
  background:#8d573e;
}

/* 모바일 */

@media(max-width:768px){

  .title h2{
    font-size:40px;
  }

  .title p{
    font-size:19px;
  }

  .course-content h3{
    font-size:26px;
  }

}

</style>
</head>

<body>

<header>
  <h1>Chinese Flow Lab</h1>
  <a href="index.html">홈으로</a>
</header>

<div class="container">

  <div class="title">
    <h2>강의실</h2>

    <p>
      원하는 강의를 선택하고<br>
      맞춤형 중국어 학습을 시작해보세요.
    </p>
  </div>

  <div class="course-grid">

    <!-- 중급 듣기 쓰기 -->

    <div class="course-card">

      <div class="course-image"
      style="background-image:url('https://images.unsplash.com/photo-1523240795612-9a054b0db644?q=80&w=1200&auto=format&fit=crop');">
      </div>

      <div class="course-content">

        <h3>중급 중국어 듣기와 쓰기</h3>

        <p>
          플립드러닝 기반의 통합형 중국어 수업입니다.<br>
          듣기·딕토글로스·의미 재구성 쓰기를 통해
          실전 중국어 능력을 향상합니다.
        </p>

        <a href="pretest.html" class="course-btn">
          강의 입장
        </a>

      </div>

    </div>

    <!-- 초급 회화 -->

    <div class="course-card">

      <div class="course-image"
      style="background-image:url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1200&auto=format&fit=crop');">
      </div>

      <div class="course-content">

        <h3>초급 중국어 회화</h3>

        <p>
          중국어 초급 학습자를 위한 회화 중심 수업입니다.<br>
          상황별 표현과 실전 회화를 통해
          기초 의사소통 능력을 기릅니다.
        </p>

        <a href="beginner-speaking.html" class="course-btn">
          강의 입장
        </a>

      </div>

    </div>

  </div>

</div>

</body>
</html>
