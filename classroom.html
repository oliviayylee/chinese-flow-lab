<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>강의실 | Chinese Flow Lab</title>

<style>
body{
  margin:0;
  font-family:"Pretendard","Noto Sans KR",sans-serif;
  background:#f6f1ea;
  color:#2f241d;
}

header{
  background:#3c2b22;
  color:white;
  padding:24px 8%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  margin:0;
  font-size:28px;
}

header a{
  color:white;
  text-decoration:none;
  opacity:.85;
}

.container{
  padding:60px 8%;
}

.title{
  margin-bottom:36px;
}

.title h2{
  font-size:42px;
  margin:0 0 12px;
  color:#4a2d1f;
}

.title p{
  font-size:18px;
  color:#666;
  line-height:1.7;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:32px;
}

.card{
  background:white;
  border-radius:32px;
  padding:40px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
  min-height:250px;
}

.icon{
  font-size:44px;
  margin-bottom:20px;
}

.card h3{
  font-size:30px;
  margin:0 0 18px;
  color:#5a3427;
}

.card p{
  font-size:17px;
  line-height:1.8;
  color:#666;
  margin-bottom:28px;
}

.card-btn{
  display:inline-block;
  background:linear-gradient(135deg,#9d5a3d,#6f432a);
  color:white;
  text-decoration:none;
  padding:14px 28px;
  border-radius:999px;
  font-weight:600;
  box-shadow:0 6px 14px rgba(111,67,42,.25);
}

.card-btn:hover{
  transform:translateY(-2px);
}

@media(max-width:768px){
  .container{
    padding:36px 5%;
  }

  .title h2{
    font-size:32px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .card{
    padding:28px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Chinese Flow Lab</h1>
  <a href="index.html">홈으로</a>
</header>

<div class="container">

  <div class="title">
    <h2>강의실</h2>
    <p>
      플립드러닝 기반 중국어 학습 공간입니다.<br>
      사전 진단, 강의 영상, 학습 프로필을 순서대로 확인해 주세요.
    </p>
  </div>

  <div class="grid">

    <div class="card">
      <div class="icon">📋</div>
      <h3>사전 진단</h3>
      <p>
        학기 초 사전평가를 통해 학습자의 중국어 수준과 취약점을 파악합니다.
      </p>
      <a href="pretest.html" class="card-btn">진단 시작하기</a>
    </div>

    <div class="card">
      <div class="icon">🎥</div>
      <h3>플립드러닝 영상</h3>
      <p>
        수업 전 영상을 시청하며 중국의 대학 생활 문화와 핵심 어휘·어법 표현을 학습합니다.
      </p>
      <a href="lecture.html" class="card-btn">영상 보기</a>
    </div>

    <div class="card">
      <div class="icon">📊</div>
      <h3>학습 프로필</h3>
      <p>
        사전 진단과 플립드러닝 퀴즈 결과를 바탕으로 학습자의 중국어 학습 특성을 분석합니다.
      </p>
      <a href="profile.html" class="card-btn">프로필 보기</a>
    </div>

  </div>

</div>

</body>
</html>
