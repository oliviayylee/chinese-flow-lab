<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강의실 | Chinese Flow Lab</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:"Pretendard","Noto Sans KR",sans-serif;
  background:#f6f1ea;
  color:#2f241d;
}

/* 상단 */

header{
  background:#3c2b22;
  color:white;
  padding:24px 8%;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  font-size:30px;
  font-weight:800;
}

header a{
  color:white;
  text-decoration:none;
  opacity:.85;
}

/* 메인 */

.container{
  max-width:900px;
  margin:auto;
  padding:80px 24px;
}

/* 제목 */

.title{
  text-align:center;
  margin-bottom:70px;
}

.title h2{
  font-size:52px;
  color:#6f432a;
  margin-bottom:20px;
}

.title p{
  font-size:22px;
  color:#5f5148;
  line-height:1.7;
}

/* 과목 리스트 */

.course-list{
  display:flex;
  flex-direction:column;
  gap:22px;
}

/* 활성 과목 */

.course-active{
  background:white;
  border-radius:28px;
  padding:34px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  box-shadow:0 10px 24px rgba(0,0,0,.08);

  transition:.25s;
}

.course-active:hover{
  transform:translateY(-3px);
}

.course-active h3{
  font-size:30px;
  margin-bottom:10px;
  color:#4b2f22;
}

.course-active p{
  font-size:18px;
  color:#5f5148;
}

/* 입장 버튼 */

.enter-btn{
  background:#a2694d;
  color:white;

  text-decoration:none;

  padding:18px 30px;

  border-radius:40px;

  font-size:18px;
  font-weight:600;

  transition:.2s;
}

.enter-btn:hover{
  background:#8d573e;
}

/* 비활성 과목 */

.course-disabled{
  background:#ece7e1;
  color:#9b928b;

  border-radius:24px;

  padding:28px 34px;

  font-size:24px;
  font-weight:600;
}

/* 모바일 */

@media(max-width:768px){

  .title h2{
    font-size:42px;
  }

  .title p{
    font-size:19px;
  }

  .course-active{
    flex-direction:column;
    align-items:flex-start;
    gap:24px;
  }

}

</style>
</head>

<body>

<header>

  <h1>Chinese Flow Lab</h1>

  <a href="index.html">홈으로</a>

</header>

<div class="container">

  <div class="title">

    <h2>강의실</h2>

    <p>
      현재 수강 가능한 강의를 선택해보세요.
    </p>

  </div>

  <div class="course-list">

    <!-- 선택 가능 -->

    <div class="course-active">

      <div>

        <h3>중급 중국어 듣기와 쓰기</h3>

        <p>
          플립드러닝 기반 통합형 중국어 수업
        </p>

      </div>

      <a href="pretest.html" class="enter-btn">
        입장하기
      </a>

    </div>

    <!-- 선택 불가 -->

    <div class="course-disabled">
      초급 중국어 회화
    </div>

    <div class="course-disabled">
      HSK 실전 연습
    </div>

  </div>

</div>

</body>
</html>
