<style>

body {
  margin: 0;
  background: #ffffff;
  color: #222;

  font-family:
    Arial,
    "Pretendard",
    "Noto Sans KR",

    sans-serif;
}


.container {
  max-width: 760px;
  margin: 0 auto;
  padding: 60px 24px;
}


.hidden {
  display: none;
}


.center {
  text-align: center;
}


h1 {
  font-size: 28px;
  margin-bottom: 25px;
}


h2 {
  font-size: 22px;
}


.instruction {
  margin: 25px 0;
  padding: 22px;

  background: #f7f7f7;

  border-radius: 8px;

  line-height: 1.8;
}


button {
  margin-top: 20px;

  padding: 12px 28px;

  font-size: 16px;

  border: 1px solid #333;
  border-radius: 6px;

  background: white;

  cursor: pointer;
}


button:hover {
  background: #f3f3f3;
}


button:disabled {
  opacity: 0.45;
  cursor: default;
}


.progress {
  margin-bottom: 30px;

  color: #777;

  font-size: 14px;
}


.sentence-area {

  min-height: 300px;

  display: flex;

  align-items: center;
  justify-content: center;
}


.sentence {

  font-size: 30px;

  line-height: 1.8;

  text-align: center;
}


.question {

  margin-top: 45px;
  margin-bottom: 30px;

  font-size: 23px;

  line-height: 1.6;
}


.options {

  display: flex;

  flex-direction: column;

  gap: 12px;
}


.option {

  padding: 15px 18px;

  border: 1px solid #ccc;
  border-radius: 6px;

  font-size: 18px;

  cursor: pointer;
}


.option:hover {

  background: #f5f5f5;
}


.option.selected {

  border: 2px solid #333;
}


.option.correct {

  background: #e7f6e7;
}


.option.incorrect {

  background: #fde8e8;
}


.feedback {

  margin-top: 20px;

  font-weight: bold;
}


.result-box {

  margin-top: 30px;

  padding: 22px;

  background: #f7f7f7;

  border-radius: 8px;

  line-height: 1.8;
}


.small-note {

  margin-top: 18px;

  color: #777;

  font-size: 13px;
  line-height: 1.6;
}


</style>

</head>

<div class="container">


<!-- ==================================================
     시작 화면
================================================== -->

<div id="startScreen">


<h1>
중국어 읽기 검사
</h1>


<div class="instruction">

<p>
화면에 중국어 문장이 한 문장씩 제시됩니다.
</p>

<p>
문장의 의미를 이해하면서 자연스럽게 읽어주세요.
</p>

<p>
문장을 모두 읽으면
<b>다음</b> 버튼을 눌러주세요.
</p>

<p>
문장이 사라진 뒤
한국어로 간단한 내용 이해 문제가 제시됩니다.
</p>

<p>
먼저 연습 문항을 진행한 후
본 검사가 시작됩니다.
</p>

</div>


<button onclick="startPractice()">
연습 시작
</button>


</div>



<!-- ==================================================
     본 검사 안내
================================================== -->

<div
id="testIntroScreen"
class="hidden center">


<h1>
연습이 끝났습니다.
</h1>


<p>
이제 본 검사를 시작합니다.
</p>


<p>
앞과 같은 방법으로 문장을 읽고
한국어 문제에 답해주세요.
</p>


<button onclick="startTest()">
본 검사 시작
</button>


</div>



<!-- ==================================================
     문장 제시
================================================== -->

<div
id="readingScreen"
class="hidden">


<div
id="progressText"
class="progress">
</div>


<div class="sentence-area">


<div
id="sentenceText"
class="sentence">
</div>


</div>


<div class="center">


<button
id="readingNextButton"
onclick="finishReading()">

다음

</button>


<div class="small-note">
스페이스바를 눌러도 다음 단계로 이동할 수 있습니다.
</div>


</div>


</div>



<!-- ==================================================

================================================== -->

<div
id="questionScreen"
class="hidden">

<div

<div

</button>


</div>



<!-- ==================================================

================================================== -->

<div
id="finishScreen"
class="hidden center">

</h1>


<p>

</p>


<div
id="resultBox"
class="result-box">
</div>


</div>


</div>

// ==================================================
// 실험 상태
// ==================================================

let phase = "practice";

let currentIndex = 0;

let selectedAnswer = null;

let sentenceStartTime = null;

let questionStartTime = null;

let currentReadingTime = null;

let currentResponseTime = null;

let results = [];



// ==================================================
// 화면 요소
// ==================================================

const startScreen =
  document.getElementById("startScreen");

const testIntroScreen =
  document.getElementById("testIntroScreen");

const readingScreen =
  document.getElementById("readingScreen");

const questionScreen =
  document.getElementById("questionScreen");

const finishScreen =
  document.getElementById("finishScreen");



// ==================================================
// 화면 숨기기
// ==================================================

function hideAll() {

  startScreen.classList.add("hidden");

  testIntroScreen.classList.add("hidden");

  readingScreen.classList.add("hidden");

  questionScreen.classList.add("hidden");

  finishScreen.classList.add("hidden");

}



// ==================================================
// 현재 item 배열
// ==================================================

function getCurrentItems() {

  if (phase === "practice") {

    return practiceItems;

  }

  return testItems;

}



// ==================================================
// 연습 시작
// ==================================================

function startPractice() {

  phase = "practice";

  currentIndex = 0;

  results = [];

  showSentence();

}



// ==================================================
// 본 검사 시작
// ==================================================

function startTest() {

  phase = "test";

  currentIndex = 0;

  showSentence();

}



// ==================================================
// 문장 제시
// ==================================================

function showSentence() {

  hideAll();

  readingScreen.classList.remove("hidden");


  const items =
    getCurrentItems();


  const item =
    items[currentIndex];


  document.getElementById(
    "sentenceText"
  ).textContent =
    item.sentence;



  if (phase === "practice") {

    document.getElementById(
      "progressText"
    ).textContent =

      "연습 " +

      (currentIndex + 1) +

      " / " +

      items.length;

  }

  else {

    document.getElementById(
      "progressText"
    ).textContent =

      "본 검사 " +

      (currentIndex + 1) +

      " / " +

      items.length;

  }


  selectedAnswer =
    null;


  currentReadingTime =
    null;


  currentResponseTime =
    null;


  sentenceStartTime =
    null;


  requestAnimationFrame(

    function() {

      sentenceStartTime =
        performance.now();

    }

  );

}



// ==================================================
// 문장 읽기 완료
// ==================================================

function finishReading() {

  if (
    sentenceStartTime === null
  ) {

    return;

  }


  const endTime =
    performance.now();


  currentReadingTime =
    Math.round(
      endTime -
      sentenceStartTime
    );


  sentenceStartTime =
    null;


  showQuestion();

}



// ==================================================
// 이해도 문제
// ==================================================

function showQuestion() {

  hideAll();

  questionScreen.classList.remove(
    "hidden"
  );


  const items =
    getCurrentItems();


  const item =
    items[currentIndex];


  const question =
    item.question;


  selectedAnswer =
    null;


  document.getElementById(
    "questionProgress"
  ).textContent =

    phase === "practice"

      ? "연습 문제"

      : "내용 이해";


  document.getElementById(
    "questionText"
  ).textContent =
    question.text;


  const optionsArea =
    document.getElementById(
      "optionsArea"
    );


  optionsArea.innerHTML =
    "";


  question.options.forEach(

    function(
      option,
      index
    ) {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "option";


      div.textContent =
        (index + 1) +
        ". " +
        option;


      div.onclick =
        function() {

          selectOption(
            index,
            div
          );

        };


      optionsArea.appendChild(
        div
      );

    }

  );


  document.getElementById(
    "feedbackText"
  ).textContent =
    "";


  document.getElementById(
    "questionNextButton"
  ).disabled =
    true;


  questionStartTime =
    null;


  requestAnimationFrame(

    function() {

      questionStartTime =
        performance.now();

    }

  );

}



// ==================================================
// 선택지 클릭
// ==================================================

function selectOption(
  index,
  element
) {

  if (
    selectedAnswer !== null
  ) {

    return;

  }


  if (
    questionStartTime === null
  ) {

    return;

  }


  selectedAnswer =
    index;


  currentResponseTime =
    Math.round(

      performance.now() -

      questionStartTime

    );


  const items =
    getCurrentItems();


  const item =
    items[currentIndex];


  const question =
    item.question;


  const optionElements =
    document.querySelectorAll(
      ".option"
    );


  element.classList.add(
    "selected"
  );



  // ------------------------------------------
  // 연습문항에서만 피드백
  // ------------------------------------------

  if (
    phase === "practice"
  ) {


    if (
      index === question.answer
    ) {


      element.classList.add(
        "correct"
      );


      document.getElementById(
        "feedbackText"
      ).textContent =

        "정답입니다.";


    }

    else {


      element.classList.add(
        "incorrect"
      );


      optionElements[
        question.answer
      ].classList.add(
        "correct"
      );


      document.getElementById(
        "feedbackText"
      ).textContent =

        "정답을 확인해주세요.";


    }

  }


  document.getElementById(
    "questionNextButton"
  ).disabled =
    false;

}



// ==================================================
// 결과 저장 후 다음 문항
// ==================================================

function nextItem() {

  if (
    selectedAnswer === null
  ) {

    return;

  }


  const items =
    getCurrentItems();


  const item =
    items[currentIndex];


  const question =
    item.question;


  const correct =

    selectedAnswer ===
    question.answer;



  // ==================================================
  // trial 데이터 저장
  // ==================================================

  results.push({


    phase:
      phase,


    itemId:
      item.id,


    type:
      item.type,


    domain:
      item.domain,


    feature:
      item.feature,


    featureCode:
      item.featureCode || "",


    charLength:
      item.charLength,


    sentence:
      item.sentence,


    readingTimeMs:
      currentReadingTime,


    question:
      question.text,


    selectedAnswerIndex:
      selectedAnswer,


    selectedAnswer:
      question.options[
        selectedAnswer
      ],


    correctAnswerIndex:
      question.answer,


    correctAnswer:
      question.options[
        question.answer
      ],


    correct:
      correct,


    responseTimeMs:
      currentResponseTime


  });



  currentIndex++;



  // ==================================================
  // 다음 문항
  // ==================================================

  if (
    currentIndex <
    items.length
  ) {

    showSentence();

    return;

  }



  // ==================================================
  // 연습 종료
  // ==================================================

  if (
    phase === "practice"
  ) {


    hideAll();


    testIntroScreen.classList.remove(
      "hidden"
    );


    return;

  }



  // ==================================================
  // 전체 검사 종료
  // ==================================================

  finishExperiment();

}



// ==================================================
// 검사 종료
// ==================================================

function finishExperiment() {

  hideAll();


  finishScreen.classList.remove(
    "hidden"
  );


  const testResults =

    results.filter(

      function(row) {

        return (
          row.phase === "test"
        );

      }

    );


  const correctCount =

    testResults.filter(

      function(row) {

        return row.correct;

      }

    ).length;


  const accuracy =

    testResults.length > 0

      ? Math.round(

          correctCount /

          testResults.length *

          100

        )

      : 0;



  document.getElementById(
    "resultBox"
  ).innerHTML =

    "본 검사가 완료되었습니다." +

    "<br><br>" +

    "총 응답 문항: " +

    testResults.length +

    "<br>" +

    "응답 데이터가 기록되었습니다.";



  // ==================================================
  // 개발자 확인용
  // 브라우저 개발자도구 Console에서 확인 가능
  // ==================================================

  console.log(
    "전체 실험 데이터",
    results
  );


  console.table(
    results
  );


  console.log(
    "본 검사 정확도:",
    accuracy + "%"
  );

}



// ==================================================
// 스페이스바로 문장 읽기 완료
// ==================================================

document.addEventListener(

  "keydown",

  function(event) {


    if (

      event.code === "Space" &&

      !readingScreen.classList.contains(
        "hidden"
      )

    ) {


      event.preventDefault();


      finishReading();


    }

  }

);


</script>
