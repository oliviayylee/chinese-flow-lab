<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chinese Flow Lab - Reading Test</title>

<style>
body {
  font-family: Arial, "Noto Sans KR", "Noto Sans SC", sans-serif;
  margin: 0;
  background: #ffffff;
  color: #222;
}

.container {
  max-width: 760px;
  margin: 0 auto;
  padding: 60px 24px;
}

.hidden {
  display: none;
}

.center {
  text-align: center;
}

h1 {
  font-size: 28px;
  margin-bottom: 25px;
}

h2 {
  font-size: 22px;
}

.instruction {
  background: #f7f7f7;
  padding: 22px;
  border-radius: 8px;
  line-height: 1.8;
  margin: 25px 0;
}

button {
  padding: 12px 28px;
  font-size: 16px;
  border: 1px solid #333;
  border-radius: 6px;
  background: white;
  cursor: pointer;
  margin-top: 20px;
}

button:hover {
  background: #f3f3f3;
}

button:disabled {
  opacity: 0.5;
  cursor: default;
}

.progress {
  font-size: 14px;
  color: #777;
  margin-bottom: 30px;
}

.sentence-area {
  min-height: 300px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.sentence {
  font-size: 30px;
  line-height: 1.8;
  text-align: center;
}

.question {
  font-size: 23px;
  margin-top: 50px;
  margin-bottom: 30px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.option {
  border: 1px solid #ccc;
  border-radius: 6px;
  padding: 15px;
  font-size: 18px;
  cursor: pointer;
}

.option:hover {
  background: #f5f5f5;
}

.option.selected {
  border: 2px solid #333;
}

.option.correct {
  background: #e7f6e7;
}

.option.incorrect {
  background: #fde8e8;
}

.feedback {
  margin-top: 20px;
  font-weight: bold;
}

.result-box {
  background: #f7f7f7;
  padding: 20px;
  border-radius: 8px;
  margin-top: 30px;
}

</style>
</head>

<body>

<div class="container">

<!-- ============================== -->
<!-- 시작 -->
<!-- ============================== -->

<div id="startScreen">

<h1>중국어 읽기 검사</h1>

<div class="instruction">

<p>
화면에 중국어 문장이 한 문장씩 제시됩니다.
</p>

<p>
문장을 자연스럽게 읽은 후
<b>다음</b> 버튼을 눌러주세요.
</p>

<p>
문장이 사라진 뒤 간단한 내용 이해 문제가 제시됩니다.
</p>

<p>
먼저 연습 문항을 진행한 후 본 검사가 시작됩니다.
</p>

</div>

<button onclick="startExperiment()">
연습 시작
</button>

</div>


<!-- ============================== -->
<!-- 본 검사 안내 -->
<!-- ============================== -->

<div id="phaseScreen" class="hidden center">

<h1>연습이 끝났습니다.</h1>

<p>
이제 본 검사를 시작합니다.
</p>

<p>
앞과 같은 방법으로 문장을 읽고 문제에 답해주세요.
</p>

<button onclick="startTest()">
본 검사 시작
</button>

</div>


<!-- ============================== -->
<!-- 문장 -->
<!-- ============================== -->

<div id="readingScreen" class="hidden">

<div id="progressText" class="progress"></div>

<div class="sentence-area">

<div id="sentenceText" class="sentence"></div>

</div>

<div class="center">

<button onclick="finishReading()">
다음
</button>

</div>

</div>


<!-- ============================== -->
<!-- 질문 -->
<!-- ============================== -->

<div id="questionScreen" class="hidden">

<div id="questionProgress" class="progress"></div>

<div id="questionText" class="question"></div>

<div id="optionsArea" class="options"></div>

<div id="feedbackText" class="feedback"></div>

<button
id="nextButton"
onclick="nextItem()"
disabled>
다음
</button>

</div>


<!-- ============================== -->
<!-- 종료 -->
<!-- ============================== -->

<div id="finishScreen" class="hidden center">

<h1>검사가 완료되었습니다.</h1>

<p>
참여해 주셔서 감사합니다.
</p>

<div id="resultBox" class="result-box"></div>

</div>

</div>



<script>

// ==================================================
// 연습 문항
// ==================================================

const practiceItems = [

{
  id: "P01",
  type: "practice",
  feature: "simple_sentence",

  sentence:
  "小林今天下午去学校图书馆看书。",

  question: {
    text: "小林下午去哪里？",
    options: [
      "图书馆",
      "医院",
      "商店",
      "饭店"
    ],
    answer: 0
  }
},

{
  id: "P02",
  type: "practice",
  feature: "simple_sentence",

  sentence:
  "李华昨天和朋友一起吃了晚饭。",

  question: {
    text: "李华和谁一起吃了晚饭？",
    options: [
      "老师",
      "朋友",
      "妈妈",
      "同学的老师"
    ],
    answer: 1
  }
}

];


// ==================================================
// 본 검사
//
// Target 3
// Control 3
// Filler 2
//
// 현재는 파일럿용으로 순서를 섞어 놓음
// ==================================================

const testItems = [


// --------------------------------------------------
// TARGET 1 : 관계절
// --------------------------------------------------

{
  id: "T01",
  type: "target",
  domain: "syntax",
  feature: "relative_clause",

  sentence:
  "老师昨天介绍的那位新同学叫王明。",

  question: {
    text: "老师昨天介绍的人是谁？",
    options: [
      "王明",
      "老师",
      "李华",
      "朋友"
    ],
    answer: 0
  }
},


// --------------------------------------------------
// CONTROL 1 : 일반 SVO
// --------------------------------------------------

{
  id: "C01",
  type: "control",
  domain: "baseline",
  feature: "simple_sentence",

  sentence:
  "李华每天早上在学校学习中文。",

  question: {
    text: "李华在哪里学习中文？",
    options: [
      "学校",
      "医院",
      "商店",
      "车站"
    ],
    answer: 0
  }
},


// --------------------------------------------------
// FILLER 1
// --------------------------------------------------

{
  id: "F01",
  type: "filler",
  domain: "general",
  feature: "simple_sentence",

  sentence:
  "今天下午学校里有一场篮球比赛。",

  question: {
    text: "学校下午有什么比赛？",
    options: [
      "篮球比赛",
      "足球比赛",
      "游泳比赛",
      "跑步比赛"
    ],
    answer: 0
  }
},


// --------------------------------------------------
// TARGET 2 : 把字句
// --------------------------------------------------

{
  id: "T02",
  type: "target",
  domain: "syntax",
  feature: "ba_sentence",

  sentence:
  "小王把老师给他的书放在桌子上了。",

  question: {
    text: "小王把书放在哪里了？",
    options: [
      "桌子上",
      "书包里",
      "教室里",
      "椅子下"
    ],
    answer: 0
  }
},


// --------------------------------------------------
// CONTROL 2
// --------------------------------------------------

{
  id: "C02",
  type: "control",
  domain: "baseline",
  feature: "simple_sentence",

  sentence:
  "妈妈昨天晚上在家做了晚饭。",

  question: {
    text: "妈妈在哪里做了晚饭？",
    options: [
      "学校",
      "饭店",
      "家",
      "公司"
    ],
    answer: 2
  }
},


// --------------------------------------------------
// TARGET 3 : 被字句
// --------------------------------------------------

{
  id: "T03",
  type: "target",
  domain: "syntax",
  feature: "bei_sentence",

  sentence:
  "小李的自行车昨天被弟弟骑走了。",

  question: {
    text: "谁骑走了小李的自行车？",
    options: [
      "小李",
      "弟弟",
      "老师",
      "朋友"
    ],
    answer: 1
  }
},


// --------------------------------------------------
// FILLER 2
// --------------------------------------------------

{
  id: "F02",
  type: "filler",
  domain: "general",
  feature: "simple_sentence",

  sentence:
  "妹妹周末常常跟妈妈一起去公园。",

  question: {
    text: "妹妹周末常常去哪里？",
    options: [
      "学校",
      "医院",
      "公园",
      "机场"
    ],
    answer: 2
  }
},


// --------------------------------------------------
// CONTROL 3
// --------------------------------------------------

{
  id: "C03",
  type: "control",
  domain: "baseline",
  feature: "simple_sentence",

  sentence:
  "王老师今天上午给学生上中文课。",

  question: {
    text: "王老师上午给学生上什么课？",
    options: [
      "英语课",
      "中文课",
      "数学课",
      "音乐课"
    ],
    answer: 1
  }
}

];



// ==================================================
// 실험 변수
// ==================================================

let phase = "practice";

let currentIndex = 0;

let selectedAnswer = null;

let sentenceStartTime = null;

let questionStartTime = null;

let currentReadingTime = null;

let results = [];



// ==================================================
// 화면
// ==================================================

const startScreen =
document.getElementById("startScreen");

const phaseScreen =
document.getElementById("phaseScreen");

const readingScreen =
document.getElementById("readingScreen");

const questionScreen =
document.getElementById("questionScreen");

const finishScreen =
document.getElementById("finishScreen");



// ==================================================
// 화면 숨기기
// ==================================================

function hideAll() {

  startScreen.classList.add("hidden");

  phaseScreen.classList.add("hidden");

  readingScreen.classList.add("hidden");

  questionScreen.classList.add("hidden");

  finishScreen.classList.add("hidden");

}



// ==================================================
// 현재 데이터
// ==================================================

function getItems() {

  if (phase === "practice") {
    return practiceItems;
  }

  return testItems;

}



// ==================================================
// 연습 시작
// ==================================================

function startExperiment() {

  phase = "practice";

  currentIndex = 0;

  showSentence();

}



// ==================================================
// 본 검사 시작
// ==================================================

function startTest() {

  phase = "test";

  currentIndex = 0;

  showSentence();

}



// ==================================================
// 문장 표시
// ==================================================

function showSentence() {

  hideAll();

  readingScreen.classList.remove("hidden");

  const items = getItems();

  const item = items[currentIndex];


  document.getElementById(
    "sentenceText"
  ).textContent = item.sentence;


  if (phase === "practice") {

    document.getElementById(
      "progressText"
    ).textContent =

      "연습 " +
      (currentIndex + 1) +
      " / " +
      items.length;

  }

  else {

    document.getElementById(
      "progressText"
    ).textContent =

      "본 검사 " +
      (currentIndex + 1) +
      " / " +
      items.length;

  }


  // 문장이 실제로 나타난 순간부터 시간 측정
  requestAnimationFrame(function() {

    sentenceStartTime =
      performance.now();

  });

}



// ==================================================
// 문장 읽기 종료
// ==================================================

function finishReading() {

  const endTime =
    performance.now();


  currentReadingTime =
    Math.round(
      endTime -
      sentenceStartTime
    );


  showQuestion();

}



// ==================================================
// 질문 표시
// ==================================================

function showQuestion() {

  hideAll();

  questionScreen.classList.remove("hidden");


  const items = getItems();

  const item = items[currentIndex];

  const question = item.question;


  selectedAnswer = null;


  document.getElementById(
    "questionProgress"
  ).textContent =
    "내용 이해";


  document.getElementById(
    "questionText"
  ).textContent =
    question.text;


  const optionsArea =
    document.getElementById(
      "optionsArea"
    );


  optionsArea.innerHTML = "";


  question.options.forEach(
    function(option, index) {

      const div =
        document.createElement("div");

      div.className =
        "option";

      div.textContent =
        (index + 1) +
        ". " +
        option;


      div.onclick =
        function() {

          selectOption(
            index,
            div
          );

        };


      optionsArea.appendChild(div);

    }
  );


  document.getElementById(
    "feedbackText"
  ).textContent = "";


  document.getElementById(
    "nextButton"
  ).disabled = true;


  requestAnimationFrame(function() {

    questionStartTime =
      performance.now();

  });

}



// ==================================================
// 답 선택
// ==================================================

function selectOption(
  index,
  element
) {

  if (
    selectedAnswer !== null
  ) {
    return;
  }


  selectedAnswer = index;


  const items = getItems();

  const item = items[currentIndex];

  const question = item.question;


  const options =
    document.querySelectorAll(
      ".option"
    );


  element.classList.add(
    "selected"
  );


  // 연습문제에서만 피드백 제공
  if (
    phase === "practice"
  ) {

    if (
      index === question.answer
    ) {

      element.classList.add(
        "correct"
      );

      document.getElementById(
        "feedbackText"
      ).textContent =
        "정답입니다.";

    }

    else {

      element.classList.add(
        "incorrect"
      );

      options[
        question.answer
      ].classList.add(
        "correct"
      );

      document.getElementById(
        "feedbackText"
      ).textContent =
        "정답을 확인해주세요.";

    }

  }


  document.getElementById(
    "nextButton"
  ).disabled = false;

}



// ==================================================
// 다음 trial
// ==================================================

function nextItem() {

  if (
    selectedAnswer === null
  ) {
    return;
  }


  const answerTime =
    performance.now();


  const responseTime =
    Math.round(
      answerTime -
      questionStartTime
    );


  const items = getItems();

  const item = items[currentIndex];

  const question = item.question;


  const correct =
    selectedAnswer ===
    question.answer;


  // 하나의 trial을 한 줄로 저장
  results.push({

    phase:
      phase,

    itemId:
      item.id,

    type:
      item.type,

    domain:
      item.domain || "practice",

    feature:
      item.feature,

    sentence:
      item.sentence,

    readingTimeMs:
      currentReadingTime,

    question:
      question.text,

    selectedAnswer:
      selectedAnswer,

    selectedText:
      question.options[
        selectedAnswer
      ],

    correctAnswer:
      question.answer,

    correctText:
      question.options[
        question.answer
      ],

    correct:
      correct,

    responseTimeMs:
      responseTime

  });


  currentIndex++;


  // 다음 문항
  if (
    currentIndex <
    items.length
  ) {

    showSentence();

    return;

  }


  // 연습 종료
  if (
    phase === "practice"
  ) {

    hideAll();

    phaseScreen.classList.remove(
      "hidden"
    );

    return;

  }


  // 본 검사 종료
  finishExperiment();

}



// ==================================================
// 종료
// ==================================================

function finishExperiment() {

  hideAll();

  finishScreen.classList.remove(
    "hidden"
  );


  const testResults =
    results.filter(
      r => r.phase === "test"
    );


  const correctCount =
    testResults.filter(
      r => r.correct
    ).length;


  document.getElementById(
    "resultBox"
  ).innerHTML =

    "본 검사 문항 수: " +
    testResults.length +

    "<br><br>" +

    "검사 데이터가 기록되었습니다.";


  console.log(
    "전체 실험 데이터:",
    results
  );

}



// ==================================================
// 스페이스바로 읽기 종료
// ==================================================

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.code === "Space" &&
      !readingScreen.classList.contains(
        "hidden"
      )
    ) {

      event.preventDefault();

      finishReading();

    }

  }
);

</script>

</body>
</html>
