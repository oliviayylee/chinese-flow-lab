<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>수업 사전진단 | Chinese Flow Lab</title>

<style>
body{
  margin:0;
  font-family:"Pretendard","Noto Sans KR",sans-serif;
  background:#f7f9fc;
  color:#172033;
}

header{
  background:white;
  padding:20px 7%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 2px 12px rgba(0,0,0,.05);
  position:sticky;
  top:0;
  z-index:10;
}

header h1{
  margin:0;
  font-size:24px;
  color:#0b1f4d;
}

header a{
  color:#0b4dcc;
  text-decoration:none;
  font-weight:800;
}

.hero{
  padding:70px 8% 45px;
  text-align:center;
  background:linear-gradient(135deg,#0b4dcc,#2f7cf6);
  color:white;
}

.hero h2{
  font-size:48px;
  margin:0 0 14px;
}

.hero p{
  font-size:18px;
  line-height:1.8;
  color:#eaf1ff;
  margin:0;
}

.container{
  max-width:1050px;
  margin:auto;
  padding:48px 6% 80px;
}

.panel{
  background:white;
  border-radius:28px;
  padding:38px;
  border:1px solid #e1e9f5;
  box-shadow:0 8px 24px rgba(15,35,80,.08);
}

.section-title{
  margin-top:46px;
  padding:16px 20px;
  background:#eef5ff;
  color:#0b4dcc;
  border-left:6px solid #0b4dcc;
  border-radius:16px;
  font-size:24px;
}

.question{
  background:#fbfdff;
  border:1px solid #e1e9f5;
  border-radius:22px;
  padding:24px;
  margin:18px 0;
}

.question p{
  font-weight:800;
  line-height:1.8;
  color:#102a64;
}

.audio-row{
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
  margin:14px 0 18px;
}

.play-btn{
  background:#0b4dcc;
  color:white;
  border:none;
  padding:11px 20px;
  border-radius:999px;
  font-weight:800;
  cursor:pointer;
}

.play-btn:disabled{
  background:#d5dce8;
  color:#777;
  cursor:not-allowed;
}

.play-count{
  color:#4c5870;
  font-weight:700;
}

label{
  display:block;
  margin:10px 0;
  line-height:1.8;
}

input[type="text"]{
  width:100%;
  padding:13px;
  border:1px solid #d7e1f0;
  border-radius:12px;
  font-size:16px;
  margin-top:10px;
  box-sizing:border-box;
}

textarea{
  width:100%;
  height:170px;
  padding:14px;
  border:1px solid #d7e1f0;
  border-radius:12px;
  font-size:16px;
  line-height:1.8;
  margin-top:10px;
  box-sizing:border-box;
}

.submit-btn{
  background:#0b4dcc;
  color:white;
  border:none;
  padding:16px 34px;
  border-radius:999px;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  margin-top:26px;
}

.submit-btn:hover{
  background:#073ca4;
}

.result{
  margin-top:30px;
  background:#eef5ff;
  border-left:6px solid #0b4dcc;
  border-radius:20px;
  padding:24px;
  line-height:1.9;
  color:#102a64;
  font-weight:700;
}

.profile-btn{
  display:inline-block;
  margin-top:26px;
  background:white;
  color:#0b4dcc;
  border:2px solid #0b4dcc;
  text-decoration:none;
  padding:14px 28px;
  border-radius:999px;
  font-weight:800;
}

footer{
  text-align:center;
  padding:34px;
  color:#6b7486;
  background:white;
  border-top:1px solid #e1e9f5;
}

@media(max-width:768px){
  header{
    flex-direction:column;
    gap:14px;
  }

  .hero h2{
    font-size:36px;
  }

  .container{
    padding:34px 5% 70px;
  }

  .panel{
    padding:24px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Chinese Flow Lab</h1>
  <a href="courses.html">← 강의실 선택</a>
</header>

<section class="hero">
  <h2>수업 사전진단</h2>
  <p>
    중급 중국어 듣기와 쓰기 수업을 시작하기 전에<br>
    듣기·딕토글로스·받아쓰기·쓰기 능력을 확인합니다.
  </p>
</section>

<div class="container">
<div class="panel">

<form id="pretestForm">

<h3 class="section-title">기본 정보</h3>

<div class="question">
  <p>학과</p>
  <input type="text" id="department">
</div>

<div class="question">
  <p>학번</p>
  <input type="text" id="studentId">
</div>

<div class="question">
  <p>이름</p>
  <input type="text" id="studentName">
</div>

<h3 class="section-title">一、문장 듣기 이해</h3>

<div id="listening"></div>

<h3 class="section-title">二、딕토글로스</h3>

<div id="dictogloss"></div>

<h3 class="section-title">三、받아쓰기</h3>

<div id="dictation"></div>

<h3 class="section-title">四、의견제시형 글쓰기</h3>

<div class="question">
  <p>21. 你觉得旅行跟团好还是自由行好？为什么？</p>
  <textarea id="q21"></textarea>
</div>

<button type="button" class="submit-btn" onclick="checkPretest()">제출하기</button>

</form>

<div id="result" class="result" style="display:none;"></div>

<a href="profile.html" class="profile-btn">학습 프로필 보기 →</a>

</div>
</div>

<footer>
  © 2026 Chinese Flow Lab
</footer>

<script>
const listeningQuestions = [
  ["他们可能在哪儿？", ["① 家里","② 车里","③ 店里"]],
  ["现在男的觉得怎么样？", ["① 累极了","② 想睡觉","③ 还可以"]],
  ["女的是什么意思？", ["① 她很累","② 她不知道玩什么","③ 她玩得不多"]],
  ["昨晚怎么了？", ["① 下雨了","② 下雪了","③ 刮风了"]],
  ["对话可能发生在什么地方？", ["① 机场","② 宾馆","③ 学校"]],
  ["大卫现在在哪儿？", ["① 在机场里","② 在家里","③ 在路上"]],
  ["女的在韩国玩几个地方？", ["① 4个","② 3个","③ 2个"]],
  ["男的这次是第几次来上海？", ["① 第一次","② 第二次","③ 第三次"]],
  ["他们原来想做什么？", ["① 看电影","② 爬山","③ 吃饭"]],
  ["女的没去过哪儿？", ["① 青岛","② 天津","③ 黄山"]]
];

const dictoglossQuestions = [
  "11. （　　）的（　　）很冷。",
  "12. 时间不早了，（　　）去（　　）比较好。",
  "13. 我虽然（　　）说得不太好，但常常去（　　），认识到不少中国朋友。",
  "14. 去（　　）得花一个多小时，他建议今天还是去（　　）比较好。",
  "15. 我（　　）花（　　）去海南岛玩一次。"
];

const dictationQuestions = [
  "16. 들은 문장을 그대로 쓰시오.",
  "17. 들은 문장을 그대로 쓰시오.",
  "18. 들은 문장을 그대로 쓰시오.",
  "19. 들은 문장을 그대로 쓰시오.",
  "20. 들은 문장을 그대로 쓰시오."
];

function audioBlock(num){
  const id = String(num).padStart(2,"0");
  return `
    <div class="audio-row">
      <button type="button" class="play-btn" onclick="playLimited('audio${id}', 'count${id}', this)">
        ▶ 음원 재생
      </button>
      <span class="play-count" id="count${id}">0 / 2회 재생</span>
      <audio id="audio${id}" preload="none">
        <source src="audio/pretest/q${id}.mp3" type="audio/mpeg">
      </audio>
    </div>
  `;
}

function renderQuestions(){
  const listeningDiv = document.getElementById("listening");

  listeningQuestions.forEach((q, index) => {
    const num = index + 1;
    listeningDiv.innerHTML += `
      <div class="question">
        <p>${num}. ${q[0]}</p>
        ${audioBlock(num)}
        ${q[1].map((option, i) => `
          <label>
            <input type="radio" name="q${num}" value="${i}">
            ${option}
          </label>
        `).join("")}
      </div>
    `;
  });

  const dictoglossDiv = document.getElementById("dictogloss");

  dictoglossQuestions.forEach((q, index) => {
    const num = index + 11;
    dictoglossDiv.innerHTML += `
      <div class="question">
        <p>${q}</p>
        ${audioBlock(num)}
        <input type="text" id="q${num}">
      </div>
    `;
  });

  const dictationDiv = document.getElementById("dictation");

  dictationQuestions.forEach((q, index) => {
    const num = index + 16;
    dictationDiv.innerHTML += `
      <div class="question">
        <p>${q}</p>
        ${audioBlock(num)}
        <input type="text" id="q${num}">
      </div>
    `;
  });
}

renderQuestions();

const playCounts = {};
const maxPlay = 2;

function playLimited(audioId, countId, button){
  if(!playCounts[audioId]){
    playCounts[audioId] = 0;
  }

  if(playCounts[audioId] >= maxPlay){
    alert("음원은 최대 2회까지만 재생할 수 있습니다.");
    return;
  }

  const audio = document.getElementById(audioId);
  audio.currentTime = 0;
  audio.play();

  playCounts[audioId]++;

  document.getElementById(countId).innerText =
    playCounts[audioId] + " / 2회 재생";

  if(playCounts[audioId] >= maxPlay){
    button.disabled = true;
    button.innerText = "재생 완료";
  }
}

const choiceAnswers = {
  q1:1, q2:2, q3:2, q4:1, q5:1,
  q6:2, q7:1, q8:1, q9:1, q10:2
};

const textAnswers = {
  q11:["东北","冬天"],
  q12:["打车","机场"],
  q13:["汉语","旅行"],
  q14:["长城","植物园"],
  q15:["打算","300块"],
  q16:["我去过长城"],
  q17:["长城离这儿不太远"],
  q18:["买不到明天去上海的飞机票"],
  q19:["到火车站要多长时间"],
  q20:["哪儿有时间去旅行呢"]
};

function normalize(text){
  return text
    .replaceAll(" ","")
    .replaceAll("　","")
    .replaceAll("。","")
    .replaceAll("，","")
    .replaceAll("？","")
    .replaceAll("?","")
    .replaceAll("東","东")
    .replaceAll("漢","汉")
    .replaceAll("語","语")
    .replaceAll("説","说")
    .replaceAll("長","长")
    .replaceAll("塊","块")
    .trim();
}

function getChoiceScore(q){
  const selected = document.querySelector(`input[name="${q}"]:checked`);
  if(!selected) return 0;
  return Number(selected.value) === choiceAnswers[q] ? 1 : 0;
}

function getTextScore(id){
  const value = normalize(document.getElementById(id).value);
  const answers = textAnswers[id].map(normalize);

  if(id >= "q11" && id <= "q15"){
    let score = 0;
    answers.forEach(ans => {
      if(value.includes(ans)){
        score += 0.5;
      }
    });
    return score;
  }

  return answers.includes(value) ? 1 : 0;
}

function checkWriting(){
  const text = document.getElementById("q21").value.trim();
  if(text.length === 0) return 0;

  const count = text.split(/[。！？!?]/)
    .filter(s => s.trim().length > 0).length;

  if(count >= 5) return 5;
  if(count >= 3) return 3;
  return 1;
}

function checkPretest(){
  let listening = 0;
  let dictogloss = 0;
  let dictation = 0;
  let writing = 0;

  for(let i=1; i<=10; i++){
    listening += getChoiceScore("q"+i);
  }

  for(let i=11; i<=15; i++){
    dictogloss += getTextScore("q"+i);
  }

  for(let i=16; i<=20; i++){
    dictation += getTextScore("q"+i);
  }

  writing = checkWriting();

  localStorage.setItem("listening", listening);
  localStorage.setItem("dictogloss", dictogloss);
  localStorage.setItem("dictation", dictation);
  localStorage.setItem("writing", writing);

  let weakest = "문장 듣기 이해";
  let weakestValue = listening / 10;

  if(dictogloss / 5 < weakestValue){
    weakest = "딕토글로스";
    weakestValue = dictogloss / 5;
  }

  if(dictation / 5 < weakestValue){
    weakest = "받아쓰기";
    weakestValue = dictation / 5;
  }

  if(writing / 5 < weakestValue){
    weakest = "의견제시형 글쓰기";
  }

  localStorage.setItem("weakest", weakest);

  document.getElementById("result").style.display = "block";
  document.getElementById("result").innerHTML = `
    <p>제출이 완료되었습니다.</p>
    <p>문장 듣기 이해: ${listening}/10</p>
    <p>딕토글로스: ${dictogloss}/5</p>
    <p>받아쓰기: ${dictation}/5</p>
    <p>의견제시형 글쓰기: ${writing}/5</p>
    <p>우선 보완 영역: ${weakest}</p>
    <p>아래의 <strong>학습 프로필 보기</strong>를 눌러 맞춤형 학습 추천을 확인하세요.</p>
  `;
}
</script>

</body>
</html>
