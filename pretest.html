<script>

const dialogues = [

{
question:"他们可能在哪儿？",
choices:["家里","车里","店里"],
answer:"2",
parts:[
  {type:"narrator", text:"第一题，他们可能在哪儿？"},
  {type:"female", text:"我来开车吧，你休息一会儿。"},
  {type:"male", text:"没关系，快到了。"}
]
},

{
question:"现在男的觉得怎么样？",
choices:["累极了","想睡觉","还可以"],
answer:"3",
parts:[
  {type:"narrator", text:"第二题，现在男的觉得怎么样？"},
  {type:"female", text:"你坐了五个小时的飞机，一定很累吧。"},
  {type:"male", text:"还行，一直在睡觉。"}
]
},

{
question:"女的是什么意思？",
choices:["她很累","她不知道玩什么","她玩得不多"],
answer:"3",
parts:[
  {type:"narrator", text:"第三题，女的是什么意思？"},
  {type:"male", text:"你这次玩了几个地方？"},
  {type:"female", text:"三天都在开会，没玩什么地方。"}
]
},

{
question:"昨晚怎么了？",
choices:["下雨了","下雪了","刮风了"],
answer:"2",
parts:[
  {type:"narrator", text:"第四题，昨晚怎么了？"},
  {type:"female", text:"昨晚下了一场大雪，杭州更漂亮了。"},
  {type:"male", text:"我们出去拍几张照。"}
]
},

{
question:"对话可能发生在什么地方？",
choices:["机场","宾馆","学校"],
answer:"1",
parts:[
  {type:"narrator", text:"第五题，对话可能发生在什么地方？"},
  {type:"male", text:"给我一个靠窗的座位。"},
  {type:"female", text:"好的，您有几件行李？"}
]
}

];

function getVoice(type){

  const voices = speechSynthesis.getVoices();

  if(type === "female"){

    return voices.find(v =>
      v.lang.includes("zh") &&
      (v.name.includes("Female") ||
       v.name.includes("Xiaoxiao") ||
       v.name.includes("Ting"))
    ) || voices.find(v => v.lang.includes("zh"));

  }

  if(type === "male"){

    return voices.find(v =>
      v.lang.includes("zh") &&
      (v.name.includes("Male") ||
       v.name.includes("Yunxi") ||
       v.name.includes("Gang"))
    ) || voices.find(v => v.lang.includes("zh"));

  }

  return voices.find(v => v.lang.includes("zh"));

}

function speakDialogue(index, btn){

  let countSpan = btn.nextElementSibling;

  let remain = parseInt(countSpan.innerText.replace(/\D/g,''));

  if(remain <= 0){
    alert("재생 제한 완료");
    return;
  }

  remain--;

  countSpan.innerText = "남은 횟수: " + remain;

  if(remain === 0){
    btn.disabled = true;
  }

  const dialogue = dialogues[index];

  let current = 0;

  function speakNext(){

    if(current >= dialogue.parts.length){
      return;
    }

    const part = dialogue.parts[current];

    const utterance =
      new SpeechSynthesisUtterance(part.text);

    utterance.lang = "zh-CN";

    utterance.rate = 0.9;

    utterance.voice = getVoice(part.type);

    utterance.onend = function(){

      current++;

      setTimeout(()=>{
        speakNext();
      },500);

    };

    speechSynthesis.speak(utterance);

  }

  speakNext();

}

window.speechSynthesis.onvoiceschanged = () => {

  speechSynthesis.getVoices();

};

const mcqArea =
document.getElementById("mcqArea");

dialogues.forEach((q,i)=>{

  let html = `
  <div class="question">

  <h3>${i+1}. ${q.question}</h3>

  <button class="listen-btn"
  onclick="speakDialogue(${i},this)">
  ▶ 듣기 재생
  </button>

  <span class="count">
  남은 횟수: 3
  </span>
  `;

  q.choices.forEach((opt,idx)=>{

    html += `
    <label>
      <input type="radio"
      name="q${i+1}"
      value="${idx+1}">

      ${idx+1}. ${opt}
    </label>
    `;

  });

  html += `</div>`;

  mcqArea.innerHTML += html;

});

</script>
