<script>
let voicesReady = false;

function loadVoices(){
  speechSynthesis.getVoices();
  voicesReady = true;
}

window.speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function getVoice(type){
  const voices = speechSynthesis.getVoices();
  const zhVoices = voices.filter(v => v.lang.includes("zh"));

  console.log("중국어 음성 목록:", zhVoices.map(v => v.name));

  if(type === "female"){
    return zhVoices.find(v =>
      v.name.includes("Xiaoxiao") ||
      v.name.includes("Ting") ||
      v.name.includes("Mei") ||
      v.name.includes("Female")
    ) || zhVoices[0];
  }

  if(type === "male"){
    return zhVoices.find(v =>
      v.name.includes("Yunxi") ||
      v.name.includes("Yunjian") ||
      v.name.includes("Kangkang") ||
      v.name.includes("Male") ||
      v.name.includes("Gang")
    ) || zhVoices[zhVoices.length - 1] || zhVoices[0];
  }

  return zhVoices[0];
}

function speakParts(parts, btn){

  let countSpan = btn.nextElementSibling;
  let remain = parseInt(countSpan.innerText.replace(/\D/g,''));

  if(remain <= 0){
    alert("재생 제한 완료");
    return;
  }

  remain--;
  countSpan.innerText = "남은 횟수: " + remain;

  if(remain === 0){
    btn.disabled = true;
  }

  speechSynthesis.cancel();

  let current = 0;

  function speakNext(){

    if(current >= parts.length) return;

    const part = parts[current];

    const utterance = new SpeechSynthesisUtterance(part.text);

    utterance.lang = "zh-CN";

    utterance.rate =
      part.type === "male"
        ? 0.58
        : part.type === "female"
        ? 0.95
        : 0.82;

    utterance.pitch =
      part.type === "male"
        ? 0.1
        : part.type === "female"
        ? 1.45
        : 1;

    utterance.volume = 1;

    utterance.voice = getVoice(part.type);

    utterance.onend = function(){
      current++;
      setTimeout(speakNext, 450);
    };

    speechSynthesis.speak(utterance);
  }

  speakNext();
}
</script>
