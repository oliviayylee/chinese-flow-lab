<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>플립드러닝 영상 | Chinese Flow Lab</title>

<style>

body{
  margin:0;
  font-family:"Pretendard","Noto Sans KR",sans-serif;
  background:#f6f1ea;
  color:#2f241d;
}

header{
  background:#3c2b22;
  color:white;
  padding:24px 8%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  margin:0;
  font-size:28px;
}

header a{
  color:white;
  text-decoration:none;
  opacity:.85;
}

.container{
  padding:60px 8%;
}

.title{
  margin-bottom:40px;
}

.title h2{
  font-size:42px;
  margin:0 0 12px;
  color:#4a2d1f;
}

.title p{
  font-size:18px;
  color:#666;
  line-height:1.8;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:32px;
}

.card{
  background:white;
  border-radius:32px;
  padding:38px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.badge{
  display:inline-block;
  background:#f2e4db;
  color:#8a4d33;
  padding:10px 18px;
  border-radius:999px;
  font-weight:700;
  margin-bottom:20px;
}

.card h3{
  margin:0 0 16px;
  font-size:32px;
  color:#5a3427;
}

.card p{
  line-height:1.9;
  color:#666;
  margin-bottom:28px;
}

.btn{
  display:inline-block;
  background:linear-gradient(135deg,#9d5a3d,#6f432a);
  color:white;
  text-decoration:none;
  padding:14px 28px;
  border-radius:999px;
  font-weight:700;
}

.btn.disabled{
  background:#d7c8be;
  pointer-events:none;
}

@media(max-width:768px){

  .container{
    padding:36px 5%;
  }

  .grid{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<header>

  <h1>Chinese Flow Lab</h1>

  <a href="classroom.html">
    강의실로 돌아가기
  </a>

</header>

<div class="container">

  <div class="title">

    <h2>플립드러닝 영상</h2>

    <p>
      학습할 주제를 선택하세요.
    </p>

  </div>

  <div class="grid">

    <div class="card">

      <div class="badge">
        Topic 1
      </div>

      <h3>학교생활</h3>

      <p>
        중국 대학생들의 학교생활과 관련된 표현을 학습합니다.
      </p>

      <a href="lecture_topic1.html" class="btn">
        강의 시작하기
      </a>

    </div>

    <div class="card">

      <div class="badge">
        Topic 2
      </div>

      <h3>여행과 교통</h3>

      <p>
        여행과 이동 상황에서 사용하는 표현을 학습합니다.
      </p>

      <a href="#" class="btn disabled">
        준비 중
      </a>

    </div>

  </div>

</div>

</body>
</html>
